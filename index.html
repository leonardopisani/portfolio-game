<style>
  :root{
    --bg:#0A0A0B;
    --ink:#F2F0EC;
    --mut:#9A968E;
    --dim:#5A5750;
    --line:rgba(242,240,236,.14);
    --line2:rgba(242,240,236,.07);
    --mal:#C8705F;
    --ok:#7E9E7A;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    -webkit-user-select:none;user-select:none;overscroll-behavior:none;touch-action:manipulation;
    font-family:"freight-neo-pro",'Fuente Base',-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    font-synthesis:none}
  #bg{position:fixed;inset:0;width:100%;height:100%;display:block}
  #grain{position:fixed;inset:0;pointer-events:none;opacity:.055;mix-blend-mode:overlay}
  #vig{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 44%,transparent 38%,rgba(0,0,0,.62) 100%)}

  /* ================= estructura ================= */
  .view{position:fixed;inset:0;display:none;flex-direction:column;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .view.on{display:flex}
  .mid{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;padding:0 20px}

  /* ================= cabecera ================= */
  header{height:50px;flex:0 0 50px;display:flex;align-items:center;justify-content:space-between;
    padding:0 16px;gap:10px}
  .volver{display:flex;align-items:center;gap:9px;background:none;border:0;cursor:pointer;
    color:var(--mut);font:inherit;font-size:10px;letter-spacing:.2em;text-transform:uppercase;
    padding:8px 4px;transition:color .25s}
  .volver:hover,.volver:focus-visible{color:var(--ink);outline:none}
  .volver i{font-style:normal;font-size:13px;line-height:1}
  .titulo{font-size:10px;letter-spacing:.34em;text-indent:.34em;color:var(--mut);
    text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .cab{flex:1;min-width:0;text-align:center}
  .der{display:flex;align-items:center;gap:8px}
  .ayuda{width:30px;height:30px;flex:0 0 30px;border-radius:50%;background:none;
    border:1px solid var(--line);color:var(--mut);font:inherit;font-size:13px;line-height:1;
    cursor:pointer;transition:color .25s,border-color .25s}
  .ayuda:hover,.ayuda:focus-visible{color:var(--ink);border-color:rgba(242,240,236,.34);outline:none}
  .regla{flex:0 0 auto;margin:-4px 0 6px;padding:0 24px;text-align:center;
    font-size:10.5px;line-height:1.55;letter-spacing:.055em;color:var(--dim);
    max-width:420px;margin-left:auto;margin-right:auto}

  /* ================= reloj ================= */
  .reloj{display:flex;align-items:center;gap:7px;border:1px solid var(--line);
    padding:7px 11px;background:none;cursor:pointer;color:var(--mut);font:inherit;
    font-size:11px;letter-spacing:.12em;font-variant-numeric:tabular-nums;
    transition:color .25s,border-color .25s}
  .reloj:hover,.reloj:focus-visible{color:var(--ink);border-color:rgba(242,240,236,.3);outline:none}
  .reloj.activo{color:var(--ink);border-color:rgba(242,240,236,.3)}
  .reloj.cerca{color:#D9A066;border-color:rgba(217,160,102,.45)}
  .reloj .pt{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.55}
  .reloj.activo .pt{animation:lat 2s ease-in-out infinite}
  @keyframes lat{0%,100%{opacity:.25}50%{opacity:1}}

  /* ================= portada ================= */
  .intro{text-align:center;display:flex;flex-direction:column;align-items:center;gap:13px}
  .intro{gap:0}
  .intro .nombre{font-size:clamp(15px,4.4vw,19px);font-weight:400;letter-spacing:.3em;
    text-indent:.26em;white-space:nowrap}
  .intro .oficio{margin-top:9px;font-size:8.5px;letter-spacing:.38em;text-indent:.38em;
    color:var(--dim);text-transform:uppercase}
  .intro .hr{width:28px;height:1px;background:var(--line);margin:16px 0}
  .intro .porque{font-size:11.5px;line-height:1.75;letter-spacing:.045em;color:var(--mut);
    max-width:300px}

  .tiras{display:flex;flex-direction:column;gap:9px;width:100%;max-width:360px}
  .tile{position:relative;overflow:hidden;display:flex;flex-direction:row;align-items:center;
    gap:15px;width:100%;height:clamp(46px,7.1vh,60px);padding:0 20px;
    border:1px solid var(--line);background:none;cursor:pointer;color:var(--ink);font:inherit;
    transition:transform .3s cubic-bezier(.2,.75,.3,1),border-color .3s ease,color .3s ease}
  .tile svg{width:22px;height:22px;overflow:visible}
  .tile .ic{flex:0 0 28px;display:flex;justify-content:center}
  .tile .ic svg[viewBox^='0 0 38']{width:30px}

"use strict";
/* =========================================================================
   Leonardo Pisani — sala de espera

/* ---------- memoria local, siempre con red ---------- */

  get(k, d) { try { const v = localStorage.getItem('lp_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('lp_' + k, JSON.stringify(v)); } catch (e) { } }

/* ---------- utilidades ---------- */
function shuffle(a, rnd) {

   mantener apretado repite la acción. */
function mando(b, accion, repetir) {
  let t1 = 0, t2 = 0;
  const parar = () => { clearTimeout(t1); clearInterval(t2); t1 = t2 = 0; };
  b.addEventListener('pointerdown', e => {

  b.addEventListener('click', e => e.preventDefault());
  b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); accion(); } });
  return b;
}

function vibra(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { } }

/* =========================================================================

/* ---------------- sudoku ---------------- */
function sudokuOk(g, i, v) {
  const r = (i / 9) | 0, c = i % 9;
  for (let k = 0; k < 9; k++) { if (g[r * 9 + k] === v) return false; if (g[k * 9 + c] === v) return false; }
  const br = r - (r % 3), bc = c - (c % 3);
  for (let y = 0; y < 3; y++) for (let x = 0; x < 3; x++) if (g[(br + y) * 9 + bc + x] === v) return false;
  return true;
}
function sudokuFill(g) {
  let best = -1, bestN = 10, bestCand = null;
  for (let i = 0; i < 81; i++) {
    if (g[i]) continue;

function slValida(g, N, i, v) {

/* =========================================================================
   JUEGO 1 — BLOQUES
   ========================================================================= */
const PIEZAS = [
  [[0, 1], [1, 1], [2, 1], [3, 1]],
  [[1, 0], [2, 0], [1, 1], [2, 1]],
  [[1, 0], [0, 1], [1, 1], [2, 1]],
  [[1, 0], [2, 0], [0, 1], [1, 1]],
  [[0, 0], [1, 0], [1, 1], [2, 1]],
  [[0, 0], [0, 1], [1, 1], [2, 1]],
  [[2, 0], [0, 1], [1, 1], [2, 1]]
];
/* cada pieza con su propio gris: monocromo pero legible */
const GRIS = ['#F2F0EC', '#CFCCC6', '#AFABA3', '#908C84', '#D9D5CE', '#A09C94', '#BEBAB2'];

function abrirBloques() {
  const COL = 10, FIL = 20;
  const cv = el('canvas'); cv.id = 'blqCv';
  areaJuego.appendChild(cv);
  const barraInfo = el('div', 'filaInfo');
  const cvN = el('canvas'); cvN.id = 'blqNext';
  const info = el('div', 'dato');
  barraInfo.append(cvN, info);
  areaJuego.appendChild(barraInfo);

  const pad = el('div', 'pad cinco');
  [['←', () => izq(), 110], ['↻', () => girar(), 0], ['→', () => der(), 110],
   ['↓', () => suave(), 70], ['⤓', () => bajar(), 0]].forEach(([txt, fn, rep]) => {
    const b = el('button', null, txt);
    mando(b, () => { if (!fin) { fn(); pintar(); } }, rep || 0);
    pad.appendChild(b);
  });
  ctrlJuego.appendChild(pad);

  const cx = cv.getContext('2d');
  let CEL = 16;
  function medir() {
    const { w, h } = espacioLibre(76);
    CEL = Math.max(8, Math.floor(Math.min(h / FIL, w / COL, 30)));
    const d = Math.min(2, devicePixelRatio || 1);
    cv.width = COL * CEL * d; cv.height = FIL * CEL * d;
    cv.style.width = COL * CEL + 'px'; cv.style.height = FIL * CEL + 'px';
    cx.setTransform(d, 0, 0, d, 0, 0);
  }

  const tab = new Int8Array(COL * FIL);
  let pieza = null, px = 0, py = 0, tipo = 0, proximo = Math.floor(Math.random() * 7);
  let puntos = 0, lineas = 0, nivel = 1, fin = false;
  let mejor = mem.get('blqMejor', 0);
  let caida = 0, lapso = 820, ultimo = performance.now(), raf = 0;

  function nueva() {
    tipo = proximo;
    proximo = Math.floor(Math.random() * 7);
    pieza = PIEZAS[tipo].map(c => c.slice());
    px = 3; py = -1;
    pintarProximo();
    if (choca(pieza, px, py)) { terminar(); }
  }

  /* la próxima pieza, chiquita al lado del tanteo */
  const cxN = cvN.getContext('2d');
  function pintarProximo() {
    const d = Math.min(2, devicePixelRatio || 1), u = 9;
    cvN.width = 4 * u * d; cvN.height = 2 * u * d;
    cvN.style.width = 4 * u + 'px'; cvN.style.height = 2 * u + 'px';
    cxN.setTransform(d, 0, 0, d, 0, 0);
    cxN.clearRect(0, 0, 4 * u, 2 * u);
    const cs = PIEZAS[proximo];
    const mnx = Math.min(...cs.map(c => c[0])), mxx = Math.max(...cs.map(c => c[0]));
    const off = (4 - (mxx - mnx + 1)) / 2 - mnx;
    cxN.fillStyle = GRIS[proximo];
    for (const [a, b] of cs) cxN.fillRect((a + off) * u + .6, b * u + .6, u - 1.2, u - 1.2);
  }
  function choca(p, x, y) {
    for (const [a, b] of p) {
      const cx2 = x + a, cy2 = y + b;
      if (cx2 < 0 || cx2 >= COL || cy2 >= FIL) return true;
      if (cy2 >= 0 && tab[cy2 * COL + cx2]) return true;
    }
    return false;
  }
  function fijar() {
    for (const [a, b] of pieza) {
      const cy2 = py + b;
      if (cy2 < 0) { terminar(); return; }
      tab[cy2 * COL + px + a] = tipo + 1;
    }
    let hechas = 0;
    for (let r = FIL - 1; r >= 0; r--) {
      let llena = true;
      for (let c = 0; c < COL; c++) if (!tab[r * COL + c]) { llena = false; break; }
      if (!llena) continue;
      tab.copyWithin(COL, 0, r * COL);
      for (let c = 0; c < COL; c++) tab[c] = 0;
      hechas++; r++;
    }
    if (hechas) {
      lineas += hechas;
      puntos += [0, 100, 300, 600, 1000][hechas] * nivel;
      nivel = 1 + Math.floor(lineas / 8);
      lapso = Math.max(130, 820 - (nivel - 1) * 72);
      vibra(hechas >= 2 ? 26 : 11);
    }
    nueva();
  }
  function izq() { if (!choca(pieza, px - 1, py)) px--; }
  function der() { if (!choca(pieza, px + 1, py)) px++; }
  function girar() {
    if (tipo === 1) return;                        // el cuadrado no gira
    let g = pieza.map(([a, b]) => [3 - b, a]);
    const mx = Math.min(...g.map(c => c[0])), my = Math.min(...g.map(c => c[1]));
    g = g.map(([a, b]) => [a - mx, b - my]);
    for (const dx of [0, -1, 1, -2, 2]) {
      if (!choca(g, px + dx, py)) { pieza = g; px += dx; return; }
    }
  }
  function bajar() {
    let n = 0;
    while (!choca(pieza, px, py + 1)) { py++; n++; }
    puntos += n * 2;
    fijar();
  }
  /* caída suave: un paso, y reinicia el reloj para que no se duplique */
  function suave() {
    if (!choca(pieza, px, py + 1)) { py++; puntos += 1; caida = 0; }
    else fijar();
  }
  function tic() { if (!choca(pieza, px, py + 1)) py++; else fijar(); }

  function sombra() {
    let y = py;
    while (!choca(pieza, px, y + 1)) y++;
    return y;
  }
  function bloque(c, r, color) {
    const x = c * CEL, y = r * CEL;
    cx.fillStyle = color;
    cx.fillRect(x + 1, y + 1, CEL - 2, CEL - 2);
    cx.fillStyle = 'rgba(10,10,11,.22)';
    cx.fillRect(x + 1, y + CEL - 4, CEL - 2, 3);
  }
  function pintar() {
    cx.fillStyle = '#0C0C0E'; cx.fillRect(0, 0, COL * CEL, FIL * CEL);
    cx.strokeStyle = 'rgba(242,240,236,.045)'; cx.lineWidth = 1;
    for (let c = 1; c < COL; c++) { cx.beginPath(); cx.moveTo(c * CEL + .5, 0); cx.lineTo(c * CEL + .5, FIL * CEL); cx.stroke(); }
    for (let r = 1; r < FIL; r++) { cx.beginPath(); cx.moveTo(0, r * CEL + .5); cx.lineTo(COL * CEL, r * CEL + .5); cx.stroke(); }
    for (let r = 0; r < FIL; r++) for (let c = 0; c < COL; c++) {
      const v = tab[r * COL + c]; if (v) bloque(c, r, GRIS[v - 1]);
    }
    if (pieza && !fin) {
      const sy = sombra();
      cx.strokeStyle = 'rgba(242,240,236,.22)'; cx.lineWidth = 1;
      for (const [a, b] of pieza) {
        if (sy + b < 0) continue;
        cx.strokeRect((px + a) * CEL + 1.5, (sy + b) * CEL + 1.5, CEL - 3, CEL - 3);
      }
      for (const [a, b] of pieza) if (py + b >= 0) bloque(px + a, py + b, GRIS[tipo]);
    }
    info.innerHTML = '<b>' + puntos + '</b> &nbsp;·&nbsp; ' + lineas + ' líneas &nbsp;·&nbsp; nivel ' + nivel +
      (mejor ? ' &nbsp;·&nbsp; récord ' + mejor : '');
  }
  function terminar() {
    if (fin) return;
    fin = true; cancelAnimationFrame(raf);
    if (puntos > mejor) { mejor = puntos; mem.set('blqMejor', mejor); }
    vibra([50, 60, 50]);
    mostrarFin('Hasta acá', String(puntos),
      lineas + (lineas === 1 ? ' línea' : ' líneas') + ' en nivel ' + nivel + '. Récord: ' + mejor + '.',
      reiniciar);
  }
  function reiniciar() {
    tab.fill(0); puntos = 0; lineas = 0; nivel = 1; lapso = 820; fin = false;
    proximo = Math.floor(Math.random() * 7);
    nueva(); ultimo = performance.now(); caida = 0;
    raf = requestAnimationFrame(bucle); pintar();
  }
  function bucle(now) {
    const dt = Math.min(120, now - ultimo); ultimo = now;
    if (!fin) {
      caida += dt;
      if (caida >= lapso) { caida = 0; tic(); }
      pintar();
      raf = requestAnimationFrame(bucle);
    }
  }

  /* gestos sobre el tablero, para quien no quiera usar los botones */
  let t0 = null;
  cv.addEventListener('pointerdown', e => { t0 = { x: e.clientX, y: e.clientY, t: performance.now() }; }, { passive: true });
  cv.addEventListener('pointerup', e => {
    if (!t0 || fin) return;
    const dx = e.clientX - t0.x, dy = e.clientY - t0.y, dt = performance.now() - t0.t;
    if (Math.abs(dx) < 16 && Math.abs(dy) < 16 && dt < 320) girar();
    else if (Math.abs(dx) > Math.abs(dy)) { const n = Math.round(dx / 26); for (let k = 0; k < Math.abs(n); k++) (n > 0 ? der : izq)(); }
    else if (dy > 30) bajar();
    t0 = null; pintar();
  }, { passive: true });

  const teclas = e => {
    if (fin) return;
    const k = e.key;
    if (k === 'ArrowLeft') izq(); else if (k === 'ArrowRight') der();
    else if (k === 'ArrowUp') girar(); else if (k === 'ArrowDown') suave();
    else if (k === ' ') { e.preventDefault(); bajar(); } else return;
    pintar();
  };
  addEventListener('keydown', teclas);
  const alRedimensionar = () => { medir(); pintar(); };
  addEventListener('resize', alRedimensionar);

  medir(); reiniciar();
  return {
    remedir() { medir(); pintar(); },
    salir() { cancelAnimationFrame(raf); fin = true; removeEventListener('keydown', teclas); removeEventListener('resize', alRedimensionar); }
  };
}

/* =========================================================================
   JUEGO 2 — REINAS
   una por fila, una por columna, una por color, y sin tocarse
   ========================================================================= */
function colorearRegiones(reg, N) {
  const ady = Array.from({ length: N }, () => new Set());
  for (let i = 0; i < N * N; i++) for (const j of vecinosDe(i, N)) if (reg[j] !== reg[i]) ady[reg[i]].add(reg[j]);
  const rgb = TONOS.map(h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);
  const dist = (a, b) => Math.hypot(rgb[a][0] - rgb[b][0], rgb[a][1] - rgb[b][1], rgb[a][2] - rgb[b][2]);
  const asign = new Array(N).fill(-1), usados = new Set();
  for (const g of [...Array(N).keys()].sort((a, b) => ady[b].size - ady[a].size)) {
    let mejor = -1, mejorD = -1;
    for (let k = 0; k < TONOS.length; k++) {
      if (usados.has(k)) continue;
      let d = 1e9;
      for (const v of ady[g]) if (asign[v] >= 0) d = Math.min(d, dist(k, asign[v]));
      if (d > mejorD) { mejorD = d; mejor = k; }
    }
    asign[g] = mejor; usados.add(mejor);
  }
  return asign;
}

function abrirReinas() {
  let N = mem.get('reiN', 8);
  let p = null, estado = null, celdas = [], listo = false;
  const tab = el('div', 'tab'); tab.id = 'reiTab';
  const aviso = el('div', 'dato');
  areaJuego.appendChild(tab); areaJuego.appendChild(aviso);

  let historia = [];
  const fila = el('div', 'fila');
  const bDeshacer = el('button', 'btn', 'Deshacer');
  const bPista = el('button', 'btn', 'Pista');
  const bLimpiar = el('button', 'btn', 'Limpiar');
  const bNuevo = el('button', 'btn', 'Otro');
  fila.append(bDeshacer, bPista, bLimpiar, bNuevo);
  const filaN = el('div', 'fila');
  const seg = el('div', 'seg');
  [7, 8, 9].forEach(n => {
    const b = el('button', 'btn', n + '×' + n);
    mando(b, () => { N = n; mem.set('reiN', n); armar(); });
    b.dataset.n = n; seg.appendChild(b);
  });
  filaN.appendChild(seg);
  ctrlJuego.append(filaN, fila);

  function guardar() { historia.push(Int8Array.from(estado)); if (historia.length > 80) historia.shift(); }

  function medirTab() {
    const { w, h } = espacioLibre();
    const lado = Math.floor(Math.min(w, h, 430));
    tab.style.width = tab.style.height = lado + 'px';
  }

  function armar() {
    [...seg.children].forEach(b => b.classList.toggle('sel', +b.dataset.n === N));
    aviso.textContent = 'Armando tablero…';
    tab.innerHTML = ''; listo = false;
    setTimeout(() => {
      p = genReinas(N);
      if (!p) { aviso.textContent = 'No salió, probá de nuevo.'; return; }
      estado = new Int8Array(N * N);           // 0 vacío · 1 marca · 2 reina
      historia = [];
      const color = colorearRegiones(p.reg, N);
      tab.style.gridTemplateColumns = 'repeat(' + N + ',1fr)';
      tab.style.gridTemplateRows = 'repeat(' + N + ',1fr)';
      tab.innerHTML = ''; celdas = [];
      for (let i = 0; i < N * N; i++) {
        const c = el('div', 'cel');
        c.style.background = TONOS[color[p.reg[i]]];
        c.dataset.i = i;
        /* borde grueso donde termina la región: se lee el tablero sin
           depender sólo del color */
        const r = (i / N) | 0, co = i % N;
        const b = (dr, dc) => {
          const rr = r + dr, cc = co + dc;
          if (rr < 0 || cc < 0 || rr >= N || cc >= N) return '2.5px solid #0A0A0B';
          return p.reg[rr * N + cc] === p.reg[i]
            ? '1px solid rgba(10,10,11,.18)' : '2.5px solid #0A0A0B';
        };
        c.style.borderTop = b(-1, 0); c.style.borderBottom = b(1, 0);
        c.style.borderLeft = b(0, -1); c.style.borderRight = b(0, 1);
        tab.appendChild(c); celdas.push(c);
      }
      medirTab(); listo = true; pintar();
    }, 20);
  }

  function tocar(i) {
    if (!listo) return;
    guardar();
    estado[i] = (estado[i] + 1) % 3;
    vibra(7); pintar();
  }

  /* Arrastrar marca × en cadena, como en el de LinkedIn: apoyás, barrés y
     todas las vacías que toques quedan tachadas. Las coronas no se tocan. */
  let arrastre = null, tocadas = null;
  const celdaEn = (x, y) => {
    const e = document.elementFromPoint(x, y);
    /* el dibujo de adentro no debe tapar la casilla */
    const c = e && e.closest ? e.closest('[data-i]') : null;
    return c && c.parentNode === tab ? +c.dataset.i : -1;
  };
  tab.addEventListener('pointerdown', e => {
    if (!listo) return;
    const i = celdaEn(e.clientX, e.clientY);
    if (i < 0) return;
    arrastre = { inicio: i, movido: false };
    tocadas = new Set([i]);
    try { tab.setPointerCapture(e.pointerId); } catch (err) { }
  });
  tab.addEventListener('pointermove', e => {
    if (!arrastre || !listo || arrastre.inerte) return;
    const i = celdaEn(e.clientX, e.clientY);
    if (i < 0 || tocadas.has(i)) return;
    if (!arrastre.movido) {
      /* Recién al salir de la primera casilla empieza el barrido, y es esa
         casilla la que decide qué hace: si estaba vacía, el dedo marca ×;
         si ya tenía una ×, el dedo las borra. Sobre una corona no hace nada,
         para no voltearla por un roce. */
      arrastre.movido = true;
      const ini = estado[arrastre.inicio];
      arrastre.modo = ini === 0 ? 'marcar' : ini === 1 ? 'borrar' : 'nada';
      if (arrastre.modo === 'nada') return;
      guardar();
      estado[arrastre.inicio] = arrastre.modo === 'marcar' ? 1 : 0;
    }
    if (arrastre.modo === 'nada') return;
    tocadas.add(i);
    if (arrastre.modo === 'marcar') { if (estado[i] === 0) { estado[i] = 1; vibra(4); } }
    else if (estado[i] === 1) { estado[i] = 0; vibra(4); }
    pintar();
  });
  const soltar = e => {
    if (!arrastre) return;
    if (!arrastre.movido) tocar(arrastre.inicio);      // fue un toque simple
    arrastre = null; tocadas = null;
    try { tab.releasePointerCapture(e.pointerId); } catch (err) { }
  };
  tab.addEventListener('pointerup', soltar);
  tab.addEventListener('pointercancel', soltar);

  function conflictos() {
    const reinas = [];
    for (let i = 0; i < N * N; i++) if (estado[i] === 2) reinas.push(i);
    const malas = new Set();
    for (let a = 0; a < reinas.length; a++) for (let b = a + 1; b < reinas.length; b++) {
      const i = reinas[a], j = reinas[b];
      const r1 = (i / N) | 0, c1 = i % N, r2 = (j / N) | 0, c2 = j % N;
      if (r1 === r2 || c1 === c2 || p.reg[i] === p.reg[j] ||
        (Math.abs(r1 - r2) <= 1 && Math.abs(c1 - c2) <= 1)) { malas.add(i); malas.add(j); }
    }
    return { reinas, malas };
  }

  function pintar() {
    const { reinas, malas } = conflictos();
    bDeshacer.disabled = !historia.length;
    [...seg.children].forEach(b => b.classList.toggle('sel', +b.dataset.n === N));
    for (let i = 0; i < N * N; i++) {
      const c = celdas[i];
      c.classList.toggle('mal', malas.has(i));
      const v = estado[i];
      c.innerHTML = v === 2 ? SVG.corona : v === 1 ? '<div class="marca">' + SVG.equis + '</div>' : '';
    }
    if (reinas.length === N && malas.size === 0) {
      aviso.textContent = '';
      listo = false;
      setTimeout(() => mostrarFin('Resuelto', '',
        'Una reina por fila, por columna y por color, sin tocarse. Limpio.', armar), 260);
    } else {
      aviso.innerHTML = '<b>' + reinas.length + '</b> de ' + N + ' reinas' +
        (malas.size ? ' · hay choques' : '');
    }
  }

  mando(bLimpiar, () => { if (!listo) return; guardar(); estado.fill(0); pintar(); });
  mando(bNuevo, armar);
  mando(bDeshacer, () => {
    if (!listo || !historia.length) return;
    estado = historia.pop(); pintar();
  });
  mando(bPista, () => {
    if (!listo) return;
    guardar();
    /* pone una reina correcta que falte; si hay alguna mal puesta, la saca */
    const { malas } = conflictos();
    if (malas.size) { estado[[...malas][0]] = 0; pintar(); return; }
    const faltan = [];
    for (let r = 0; r < N; r++) { const i = r * N + p.sol[r]; if (estado[i] !== 2) faltan.push(i); }
    if (!faltan.length) return;
    const i = faltan[Math.floor(Math.random() * faltan.length)];
    estado[i] = 2; vibra(12); pintar();
  });

  const alRedimensionar = () => medirTab();
  addEventListener('resize', alRedimensionar);
  armar();
  return { salir() { removeEventListener('resize', alRedimensionar); } };
}

/* =========================================================================
   JUEGO 3 — SUDOKU
   ========================================================================= */
function abrirSudoku() {
  let nivel = mem.get('sudNivel', 1);
  let p = null, val = null, notas = null, celdas = [], sel = -1, listo = false, modoNota = false;

  const tab = el('div', 'tab'); tab.id = 'sudTab';
  tab.style.gridTemplateColumns = 'repeat(9,1fr)';
  tab.style.gridTemplateRows = 'repeat(9,1fr)';
  const aviso = el('div', 'dato');
  areaJuego.append(tab, aviso);

  const filaNum = el('div', 'tecl');
  const teclas9 = [];
  for (let n = 1; n <= 9; n++) {
    const b = el('button', 'btn', String(n));
    mando(b, () => poner(n));
    teclas9.push(b); filaNum.appendChild(b);
  }
  const bBorrar = el('button', 'btn borrar', '⌫');
  mando(bBorrar, () => poner(0));
  filaNum.appendChild(bBorrar);

  const filaAcc = el('div', 'fila');
  const bDeshacer = el('button', 'btn', 'Deshacer');
  const bNota = el('button', 'btn', 'Notas');
  const bNuevo = el('button', 'btn', 'Otro');
  const bBajar = el('button', 'btn', 'Más fácil');
  mando(bNota, () => { modoNota = !modoNota; bNota.classList.toggle('sel', modoNota); });
  mando(bNuevo, armar);
  mando(bBajar, () => { if (nivel > 1) { nivel--; mem.set('sudNivel', nivel); armar(); } });
  mando(bDeshacer, () => {
    if (!listo || !historia.length) return;
    const h = historia.pop();
    val = h.val; notas = h.notas; pintar();
  });
  filaAcc.append(bDeshacer, bNota, bNuevo, bBajar);
  ctrlJuego.append(filaNum, filaAcc);

  let historia = [];
  function guardar() {
    historia.push({ val: val.slice(), notas: notas.map(s2 => new Set(s2)) });
    if (historia.length > 80) historia.shift();
  }

  function medirTab() {
    const { w, h } = espacioLibre();
    const lado = Math.floor(Math.min(w, h, 430));
    tab.style.width = tab.style.height = lado + 'px';
  }

  function armar() {
    bBajar.style.display = nivel > 1 ? '' : 'none';
    aviso.textContent = 'Armando tablero…';
    tab.innerHTML = ''; listo = false; sel = -1;
    setTimeout(() => {
      p = genSudoku(pistasDe(nivel));
      val = p.grid.slice();
      notas = Array.from({ length: 81 }, () => new Set());
      historia = [];
      tab.innerHTML = ''; celdas = [];
      for (let i = 0; i < 81; i++) {
        const c = el('div', 'cel');
        const r = (i / 9) | 0, co = i % 9;
        if (co === 2 || co === 5) c.classList.add('br');
        if (r === 2 || r === 5) c.classList.add('bb');
        if (p.grid[i]) c.classList.add('fija');
        mando(c, () => { sel = i; pintar(); });
        tab.appendChild(c); celdas.push(c);
      }
      medirTab(); listo = true; pintar();
    }, 20);
  }

  function poner(n) {
    if (!listo || sel < 0 || p.grid[sel]) return;
    guardar();
    if (modoNota && n) {
      if (notas[sel].has(n)) notas[sel].delete(n); else notas[sel].add(n);
    } else {
      val[sel] = n; notas[sel].clear();
    }
    vibra(6); pintar();
  }

  function malas() {
    const s = new Set();
    for (let i = 0; i < 81; i++) {
      const v = val[i]; if (!v) continue;
      const r = (i / 9) | 0, c = i % 9;
      for (let k = 0; k < 9; k++) {
        const a = r * 9 + k, b = k * 9 + c;
        if (a !== i && val[a] === v) { s.add(i); s.add(a); }
        if (b !== i && val[b] === v) { s.add(i); s.add(b); }
      }
      const br = r - r % 3, bc = c - c % 3;
      for (let y = 0; y < 3; y++) for (let x = 0; x < 3; x++) {
        const j = (br + y) * 9 + bc + x;
        if (j !== i && val[j] === v) { s.add(i); s.add(j); }
      }
    }
    return s;
  }

  function pintar() {
    const mal = malas();
    bDeshacer.disabled = !historia.length;
    /* el número que ya está nueve veces se apaga: una tecla menos que mirar */
    const cuantos = new Array(10).fill(0);
    val.forEach(v => { if (v) cuantos[v]++; });
    teclas9.forEach((b, k) => b.classList.toggle('gastada', cuantos[k + 1] >= 9));
    const sr = sel >= 0 ? (sel / 9) | 0 : -1, sc = sel >= 0 ? sel % 9 : -1;
    const sv = sel >= 0 ? val[sel] : 0;
    let faltan = 0;
    for (let i = 0; i < 81; i++) {
      const c = celdas[i], v = val[i];
      const r = (i / 9) | 0, co = i % 9;
      c.classList.toggle('mal', mal.has(i));
      c.classList.toggle('act', i === sel);
      c.classList.toggle('par', sel >= 0 && i !== sel && (r === sr || co === sc ||
        ((r / 3 | 0) === (sr / 3 | 0) && (co / 3 | 0) === (sc / 3 | 0))));
      c.classList.toggle('igual', i !== sel && !!sv && v === sv);
      if (v) c.textContent = String(v);
      else if (notas[i].size) {
        c.textContent = '';
        const n = el('div', 'notas');
        for (let k = 1; k <= 9; k++) n.appendChild(el('span', null, notas[i].has(k) ? String(k) : ''));
        c.appendChild(n);
      } else c.textContent = '';
      if (!v) faltan++;
    }
    if (!faltan && !mal.size) {
      listo = false;
      setTimeout(() => mostrarFin('Nivel ' + nivel + ' resuelto', '',
        'Va el ' + (nivel + 1) + ', con una pista menos.',
        () => { nivel++; mem.set('sudNivel', nivel); armar(); }), 260);
    } else aviso.innerHTML = 'Nivel <b>' + nivel + '</b> &nbsp;·&nbsp; faltan ' + faltan +
      (mal.size ? ' &nbsp;·&nbsp; hay repetidos' : '');
  }

  const teclas = e => {
    if (!listo) return;
    if (e.key >= '1' && e.key <= '9') poner(+e.key);
    else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') poner(0);
    else if (sel >= 0) {
      const d = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -9, ArrowDown: 9 }[e.key];
      if (d == null) return;
      e.preventDefault();
      const n = sel + d;
      if (n >= 0 && n < 81 && !(Math.abs(d) === 1 && ((sel / 9) | 0) !== ((n / 9) | 0))) { sel = n; pintar(); }
    }
  };
  addEventListener('keydown', teclas);
  const alRedimensionar = () => medirTab();
  addEventListener('resize', alRedimensionar);
  armar();
  return { salir() { removeEventListener('keydown', teclas); removeEventListener('resize', alRedimensionar); } };
}

/* =========================================================================
   JUEGO 4 — SOL Y LUNA
   mitad y mitad en cada fila y columna, nunca tres seguidos,
   = vecinas iguales · × vecinas distintas
   ========================================================================= */
function abrirSolLuna() {
  const N = 6;
  let p = null, val = null, celdas = [], listo = false;
  const wrap = el('div'); wrap.id = 'slWrap';
  const tab = el('div', 'tab'); tab.id = 'slTab';
  tab.style.gridTemplateColumns = 'repeat(' + N + ',1fr)';
  tab.style.gridTemplateRows = 'repeat(' + N + ',1fr)';
  wrap.appendChild(tab);
  const aviso = el('div', 'dato');
  areaJuego.append(wrap, aviso);

  const fila = el('div', 'fila');
  const bDeshacer = el('button', 'btn', 'Deshacer');
  const bLimpiar = el('button', 'btn', 'Limpiar');
  const bNuevo = el('button', 'btn', 'Otro tablero');
  fila.append(bDeshacer, bLimpiar, bNuevo);
  ctrlJuego.appendChild(fila);
  let historia = [];

  function medirTab() {
    const { w, h } = espacioLibre();
    const lado = Math.floor(Math.min(w, h, 410));
    tab.style.width = tab.style.height = lado + 'px';
    wrap.style.width = lado + 'px'; wrap.style.height = lado + 'px';
    colocarSignos(lado);
  }
  function colocarSignos(lado) {
    if (!p) return;
    wrap.querySelectorAll('.signo').forEach(s => s.remove());
    const paso = lado / N;
    for (const s of p.signos) {
      const ra = (s.a / N) | 0, ca = s.a % N, rb = (s.b / N) | 0, cb = s.b % N;
      const x = (ca + cb) / 2 * paso + paso / 2;
      const y = (ra + rb) / 2 * paso + paso / 2;
      const d = el('div', 'signo');
      d.innerHTML = s.t === '=' ? SVG.igual : SVG.distinto;
      d.style.left = x + 'px'; d.style.top = y + 'px';
      wrap.appendChild(d);
    }
  }

  function armar() {
    aviso.textContent = 'Armando tablero…';
    tab.innerHTML = ''; listo = false;
    wrap.querySelectorAll('.signo').forEach(s => s.remove());
    setTimeout(() => {
      p = genSolLuna(N);
      if (!p) { aviso.textContent = 'No salió, probá de nuevo.'; return; }
      val = p.dados.slice(); historia = [];
      tab.innerHTML = ''; celdas = [];
      for (let i = 0; i < N * N; i++) {
        const c = el('div', 'cel');
        if (p.dados[i]) c.classList.add('fija');
        else c.dataset.i = i;
        tab.appendChild(c); celdas.push(c);
      }
      medirTab(); listo = true; pintar();
    }, 20);
  }

  function guardar() { historia.push(val.slice()); if (historia.length > 80) historia.shift(); }
  function tocar(i) {
    if (!listo) return;
    guardar();
    val[i] = (val[i] + 1) % 3;
    vibra(7); pintar();
  }

  /* Arrastrar pinta el mismo símbolo en todas las casillas que toques, y
     mantener apretada una casilla vacía pone la luna de una, sin pasar
     por el sol. */
  let arrastre = null, tocadas = null, largo = 0;
  const celdaEn = (x, y) => {
    const e = document.elementFromPoint(x, y);
    const c = e && e.closest ? e.closest('[data-i]') : null;
    return c && c.parentNode === tab ? +c.dataset.i : -1;
  };
  tab.addEventListener('pointerdown', e => {
    if (!listo) return;
    const i = celdaEn(e.clientX, e.clientY);
    if (i < 0) return;
    arrastre = { inicio: i, movido: false, pinta: 0 };
    tocadas = new Set([i]);
    clearTimeout(largo);
    largo = setTimeout(() => {
      if (!arrastre || arrastre.movido) return;
      guardar(); val[arrastre.inicio] = 2; arrastre = null; vibra(16); pintar();
    }, 420);
    try { tab.setPointerCapture(e.pointerId); } catch (err) { }
  });
  tab.addEventListener('pointermove', e => {
    if (!arrastre || !listo) return;
    const i = celdaEn(e.clientX, e.clientY);
    if (i < 0 || tocadas.has(i)) return;
    clearTimeout(largo);
    if (!arrastre.movido) {
      arrastre.movido = true;
      guardar();
      arrastre.pinta = (val[arrastre.inicio] + 1) % 3;
      val[arrastre.inicio] = arrastre.pinta;
    }
    tocadas.add(i);
    val[i] = arrastre.pinta; vibra(4);
    pintar();
  });
  const soltar = e => {
    clearTimeout(largo);
    if (!arrastre) return;
    if (!arrastre.movido) tocar(arrastre.inicio);
    arrastre = null; tocadas = null;
    try { tab.releasePointerCapture(e.pointerId); } catch (err) { }
  };
  tab.addEventListener('pointerup', soltar);
  tab.addEventListener('pointercancel', soltar);

  function malas() {
    const s = new Set();
    /* tres seguidos */
    for (let r = 0; r < N; r++) for (let c = 0; c + 2 < N; c++) {
      const a = r * N + c, b = a + 1, d = a + 2;
      if (val[a] && val[a] === val[b] && val[b] === val[d]) { s.add(a); s.add(b); s.add(d); }
    }
    for (let c = 0; c < N; c++) for (let r = 0; r + 2 < N; r++) {
      const a = r * N + c, b = a + N, d = a + 2 * N;
      if (val[a] && val[a] === val[b] && val[b] === val[d]) { s.add(a); s.add(b); s.add(d); }
    }
    /* más de la mitad */
    for (let r = 0; r < N; r++) {
      let u = 0, d = 0; for (let c = 0; c < N; c++) { if (val[r * N + c] === 1) u++; else if (val[r * N + c] === 2) d++; }
      if (u > N / 2 || d > N / 2) for (let c = 0; c < N; c++) if (val[r * N + c]) s.add(r * N + c);
    }
    for (let c = 0; c < N; c++) {
      let u = 0, d = 0; for (let r = 0; r < N; r++) { if (val[r * N + c] === 1) u++; else if (val[r * N + c] === 2) d++; }
      if (u > N / 2 || d > N / 2) for (let r = 0; r < N; r++) if (val[r * N + c]) s.add(r * N + c);
    }
    /* signos */
    for (const sg of p.signos) {
      const a = val[sg.a], b = val[sg.b];
      if (!a || !b) continue;
      if ((sg.t === '=' && a !== b) || (sg.t === 'x' && a === b)) { s.add(sg.a); s.add(sg.b); }
    }
    return s;
  }

  function pintar() {
    const mal = malas();
    bDeshacer.disabled = !historia.length;
    /* una fila o columna terminada y sin errores se apaga un poco: así se ve
       de un vistazo lo que ya está cerrado */
    const filaHecha = [], colHecha = [];
    for (let r = 0; r < N; r++) {
      let llena = true, sucia = false;
      for (let c = 0; c < N; c++) { const i = r * N + c; if (!val[i]) llena = false; if (mal.has(i)) sucia = true; }
      filaHecha[r] = llena && !sucia;
    }
    for (let c = 0; c < N; c++) {
      let llena = true, sucia = false;
      for (let r = 0; r < N; r++) { const i = r * N + c; if (!val[i]) llena = false; if (mal.has(i)) sucia = true; }
      colHecha[c] = llena && !sucia;
    }
    let faltan = 0;
    for (let i = 0; i < N * N; i++) {
      const c = celdas[i], v = val[i];
      c.classList.toggle('mal', mal.has(i));
      c.classList.toggle('hecha', filaHecha[(i / N) | 0] || colHecha[i % N]);
      c.innerHTML = v === 1 ? SVG.sol : v === 2 ? SVG.luna : '';
      if (!v) faltan++;
    }
    if (!faltan && !mal.size) {
      listo = false;
      setTimeout(() => mostrarFin('Resuelto', '', 'Sol y luna, mitad y mitad, sin tres seguidos.', armar), 260);
    } else aviso.innerHTML = 'Faltan <b>' + faltan + '</b>' + (mal.size ? ' · algo no cierra' : '');
  }

  mando(bLimpiar, () => { if (!listo) return; guardar(); val = p.dados.slice(); pintar(); });
  mando(bNuevo, armar);
  mando(bDeshacer, () => {
    if (!listo || !historia.length) return;
    val = historia.pop(); pintar();
  });

  const alRedimensionar = () => medirTab();
  addEventListener('resize', alRedimensionar);
  armar();
  return { salir() { removeEventListener('resize', alRedimensionar); } };
}


/* =========================================================================
   JUEGO 5 — LABERINTO
   Un guiño al género de laberinto y persecución, con dibujo y trazado
   propios: el que recorre es un diafragma que abre y cierra al avanzar,
   los puntos son fotogramas y los que persiguen, drones con una lente.
   ========================================================================= */
const LAB_C = 15, LAB_R = 17;

/* laberinto perfecto por excavación y después "trenzado": a los callejones
   sin salida se les abre una pared, así siempre hay por dónde escapar */
function genLaberinto(C, R) {
  const m = new Uint8Array(C * R).fill(1);
  const ix = (x, y) => y * C + x;
  const pila = [[1, 1]]; m[ix(1, 1)] = 0;
  while (pila.length) {
    const [x, y] = pila[pila.length - 1];
    const vs = [];
    for (const [dx, dy] of [[2, 0], [-2, 0], [0, 2], [0, -2]]) {
      const nx = x + dx, ny = y + dy;
      if (nx > 0 && ny > 0 && nx < C - 1 && ny < R - 1 && m[ix(nx, ny)] === 1) vs.push([nx, ny, dx, dy]);
    }
    if (!vs.length) { pila.pop(); continue; }
    const [nx, ny, dx, dy] = vs[Math.floor(Math.random() * vs.length)];
    m[ix(x + dx / 2, y + dy / 2)] = 0; m[ix(nx, ny)] = 0;
    pila.push([nx, ny]);
  }
  for (let y = 1; y < R - 1; y += 2) for (let x = 1; x < C - 1; x += 2) {
    const abiertos = [], cerrados = [];
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const wx = x + dx, wy = y + dy;
      if (wx <= 0 || wy <= 0 || wx >= C - 1 || wy >= R - 1) continue;
      (m[ix(wx, wy)] === 0 ? abiertos : cerrados).push([wx, wy]);
    }
    if (abiertos.length <= 1 && cerrados.length)
      { const [wx, wy] = cerrados[Math.floor(Math.random() * cerrados.length)]; m[ix(wx, wy)] = 0; }
  }
  return m;
}

function abrirLaberinto() {
  const C = LAB_C, R = LAB_R;
  const cv = el('canvas'); cv.id = 'labCv';
  const info = el('div', 'dato');
  areaJuego.append(cv, info);

  /* Cruz: con el teléfono apoyado, el pulgar busca una cruz, no una fila.
     Se puede apoyar el dedo y deslizarlo entre los brazos sin levantarlo. */
  const filaPausa = el('div', 'fila');
  filaPausa.style.marginTop = '10px';
  const bPausa = el('button', 'btn', 'Pausa');
  bPausa.style.minHeight = '42px';
  bPausa.style.padding = '0 26px';
  filaPausa.appendChild(bPausa);
  const pad = el('div', 'cruz');
  [['ar', '↑', [0, -1]], ['iz', '←', [-1, 0]], ['de', '→', [1, 0]], ['ab', '↓', [0, 1]]]
    .forEach(([cls, txt, d]) => {
      const b = el('button', cls, txt);
      b.dataset.d = d.join(',');
      pad.appendChild(b);
    });
  ctrlJuego.append(pad, filaPausa);

  let apretado = null;
  const brazoEn = (x, y) => {
    const e = document.elementFromPoint(x, y);
    const b = e && e.closest ? e.closest('[data-d]') : null;
    return b && b.parentNode === pad ? b : null;
  };
  const usar = b => {
    if (!b || fin) return;
    if (apretado && apretado !== b) apretado.classList.remove('on');
    apretado = b; b.classList.add('on');
    yo.pedida = b.dataset.d.split(',').map(Number);
    vibra(5);
  };
  pad.addEventListener('pointerdown', e => {
    e.preventDefault();
    usar(brazoEn(e.clientX, e.clientY));
    try { pad.setPointerCapture(e.pointerId); } catch (err) { }
  });
  pad.addEventListener('pointermove', e => {
    if (!apretado) return;
    const b = brazoEn(e.clientX, e.clientY);
    if (b && b !== apretado) usar(b);
  });
  const soltarCruz = () => { if (apretado) apretado.classList.remove('on'); apretado = null; };
  pad.addEventListener('pointerup', soltarCruz);
  pad.addEventListener('pointercancel', soltarCruz);
  pad.addEventListener('click', e => e.preventDefault());

  let enPausa = false;
  mando(bPausa, () => {
    if (fin) return;
    enPausa = !enPausa;
    bPausa.textContent = enPausa ? 'Seguir' : 'Pausa';
    bPausa.classList.toggle('sel', enPausa);
    if (!enPausa) { ultimo = performance.now(); raf = requestAnimationFrame(bucle); }
  });

  const cx = cv.getContext('2d');
  let CEL = 18;
  function medir() {
    const { w, h } = espacioLibre(40);
    CEL = Math.max(7, Math.floor(Math.min(h / R, w / C, 26)));
    const d = Math.min(2, devicePixelRatio || 1);
    cv.width = C * CEL * d; cv.height = R * CEL * d;
    cv.style.width = C * CEL + 'px'; cv.style.height = R * CEL + 'px';
    cx.setTransform(d, 0, 0, d, 0, 0);
  }

  let mapa = null, puntos = null, destellos = null;
  let quedan = 0, tanteo = 0, vidas = 3, nivel = 1, fin = false;
  let asustados = 0, pausa = 0, raf = 0, ultimo = performance.now(), reloj = 0;
  let mejor = mem.get('labMejor', 0);
  const ix = (x, y) => y * C + x;
  const libre = (x, y) => x >= 0 && y >= 0 && x < C && y < R && mapa[ix(x, y)] === 0;

  const MEDIO = [7, 9], SALIDA = [7, R - 2];
  let yo = null, drones = [];

  function nuevoBicho(x, y, dir) {
    return { x, y, nx: x, ny: y, t: 0, dir, pedida: null, casa: [x, y] };
  }
  function colocar() {
    yo = nuevoBicho(SALIDA[0], SALIDA[1], [0, 0]);
    const cerca = [[0, 0], [-2, 0], [2, 0], [0, -2]]
      .map(([a, b]) => [MEDIO[0] + a, MEDIO[1] + b])
      .filter(([a, b]) => libre(a, b));
    drones = [];
    for (let k = 0; k < 3; k++) {
      const [a, b] = cerca[k % cerca.length];
      drones.push(nuevoBicho(a, b, [0, 0]));
    }
  }

  function nivelNuevo() {
    mapa = genLaberinto(C, R);
    puntos = new Uint8Array(C * R);
    destellos = new Uint8Array(C * R);
    quedan = 0;
    for (let y = 1; y < R - 1; y++) for (let x = 1; x < C - 1; x++) {
      if (mapa[ix(x, y)]) continue;
      if (Math.abs(x - MEDIO[0]) <= 1 && Math.abs(y - MEDIO[1]) <= 1) continue;
      if (x === SALIDA[0] && y === SALIDA[1]) continue;
      puntos[ix(x, y)] = 1; quedan++;
    }
    for (const [x, y] of [[1, 1], [C - 2, 1], [1, R - 2], [C - 2, R - 2]]) {
      if (!libre(x, y)) continue;
      destellos[ix(x, y)] = 1;
      if (puntos[ix(x, y)]) { puntos[ix(x, y)] = 0; quedan--; }
    }
    colocar(); asustados = 0; pausa = .9;
  }

  /* --- movimiento: se avanza de casilla a casilla, se dobla en el centro --- */
  function mover(b, vel, dt, elegir) {
    if (b.dir[0] === 0 && b.dir[1] === 0) {
      const d = elegir(b);
      if (!d) return;
      b.dir = d; b.nx = b.x + d[0]; b.ny = b.y + d[1]; b.t = 0;
    }
    /* media vuelta en el acto */
    if (b.pedida && b.pedida[0] === -b.dir[0] && b.pedida[1] === -b.dir[1] && b.t > 0) {
      const ax = b.x, ay = b.y;
      b.x = b.nx; b.y = b.ny; b.nx = ax; b.ny = ay;
      b.dir = b.pedida; b.t = 1 - b.t; b.pedida = null;
    }
    b.t += vel * dt;
    while (b.t >= 1) {
      b.t -= 1; b.x = b.nx; b.y = b.ny;
      const d = elegir(b);
      if (!d) { b.t = 0; b.dir = [0, 0]; b.nx = b.x; b.ny = b.y; return; }
      b.dir = d; b.nx = b.x + d[0]; b.ny = b.y + d[1];
    }
  }
  const opciones = b => [[1, 0], [-1, 0], [0, 1], [0, -1]].filter(d => libre(b.x + d[0], b.y + d[1]));

  function elegirYo(b) {
    if (b.pedida && libre(b.x + b.pedida[0], b.y + b.pedida[1])) { const d = b.pedida; b.pedida = null; return d; }
    if (libre(b.x + b.dir[0], b.y + b.dir[1]) && (b.dir[0] || b.dir[1])) return b.dir;
    return null;
  }
  function elegirDron(b) {
    let op = opciones(b);
    if (!op.length) return null;
    const sinVolver = op.filter(d => !(d[0] === -b.dir[0] && d[1] === -b.dir[1]));
    if (sinVolver.length) op = sinVolver;
    if (Math.random() < .22) return op[Math.floor(Math.random() * op.length)];
    const huir = asustados > 0;
    let mejorD = null, mejorV = huir ? -1 : 1e9;
    for (const d of op) {
      const dx = b.x + d[0] - yo.x, dy = b.y + d[1] - yo.y;
      const v = dx * dx + dy * dy;
      if (huir ? v > mejorV : v < mejorV) { mejorV = v; mejorD = d; }
    }
    return mejorD || op[0];
  }

  function px(b) { return { x: (b.x + (b.nx - b.x) * b.t + .5) * CEL, y: (b.y + (b.ny - b.y) * b.t + .5) * CEL }; }

  /* --- dibujo --- */
  /* Las paredes se pintan como una sola masa y después se les dibuja el
     contorno sólo donde dan al pasillo: así se leen como muros continuos
     y no como una fila de piedritas. */
  function paredes() {
    cx.fillStyle = '#191920';
    for (let y = 0; y < R; y++) for (let x = 0; x < C; x++)
      if (mapa[ix(x, y)]) cx.fillRect(x * CEL, y * CEL, CEL, CEL);
    cx.strokeStyle = 'rgba(242,240,236,.3)';
    cx.lineWidth = 1.4; cx.lineCap = 'square';
    cx.beginPath();
    for (let y = 0; y < R; y++) for (let x = 0; x < C; x++) {
      if (!mapa[ix(x, y)]) continue;
      const a = x * CEL, b = y * CEL;
      const hueco = (dx, dy) => {
        const nx = x + dx, ny = y + dy;
        return nx >= 0 && ny >= 0 && nx < C && ny < R && mapa[ix(nx, ny)] === 0;
      };
      if (hueco(0, -1)) { cx.moveTo(a, b + .7); cx.lineTo(a + CEL, b + .7); }
      if (hueco(0, 1)) { cx.moveTo(a, b + CEL - .7); cx.lineTo(a + CEL, b + CEL - .7); }
      if (hueco(-1, 0)) { cx.moveTo(a + .7, b); cx.lineTo(a + .7, b + CEL); }
      if (hueco(1, 0)) { cx.moveTo(a + CEL - .7, b); cx.lineTo(a + CEL - .7, b + CEL); }
    }
    cx.stroke();
  }
  function diafragma(p, abierto, ang) {
    const r = CEL * .46;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(ang);
    cx.fillStyle = '#F2F0EC';
    cx.beginPath();
    const boca = abierto * .8;                       // apertura de la "boca"
    for (let k = 0; k <= 6; k++) {
      const a = boca + k * (2 * Math.PI - 2 * boca) / 6;
      const vx = Math.cos(a) * r, vy = Math.sin(a) * r;
      k ? cx.lineTo(vx, vy) : cx.moveTo(vx, vy);
    }
    if (boca > .02) cx.lineTo(0, 0);
    cx.closePath(); cx.fill();
    /* hojas del diafragma */
    cx.strokeStyle = 'rgba(10,10,11,.22)'; cx.lineWidth = Math.max(.8, CEL * .04);
    for (let k = 2; k < 6; k += 2) {
      const a = boca + k * (2 * Math.PI - 2 * boca) / 6;
      cx.beginPath(); cx.moveTo(0, 0); cx.lineTo(Math.cos(a) * r * .82, Math.sin(a) * r * .82); cx.stroke();
    }
    cx.restore();
  }
  function dron(p, k, miedo) {
    const r = CEL * .36;
    cx.fillStyle = miedo ? '#3A3A42' : ['#A8705E', '#4E6E80', '#6E8C5A'][k % 3];
    cx.beginPath();
    if (cx.roundRect) cx.roundRect(p.x - r, p.y - r * .8, r * 2, r * 1.6, r * .4);
    else cx.rect(p.x - r, p.y - r * .8, r * 2, r * 1.6);
    cx.fill();
    /* rotores */
    cx.strokeStyle = miedo ? '#5A5750' : 'rgba(10,10,11,.5)';
    cx.lineWidth = Math.max(1, CEL * .07);
    cx.beginPath(); cx.moveTo(p.x - r, p.y - r); cx.lineTo(p.x - r * .35, p.y - r); cx.stroke();
    cx.beginPath(); cx.moveTo(p.x + r * .35, p.y - r); cx.lineTo(p.x + r, p.y - r); cx.stroke();
    /* lente */
    cx.fillStyle = miedo ? '#9A968E' : '#0A0A0B';
    cx.beginPath(); cx.arc(p.x, p.y, r * .42, 0, 7); cx.fill();
    if (!miedo) { cx.fillStyle = 'rgba(242,240,236,.75)'; cx.beginPath(); cx.arc(p.x - r * .13, p.y - r * .13, r * .13, 0, 7); cx.fill(); }
  }

  function pintar() {
    cx.fillStyle = '#08080A'; cx.fillRect(0, 0, C * CEL, R * CEL);
    paredes();
    /* fotogramas */
    cx.fillStyle = 'rgba(242,240,236,.6)';
    const s = Math.max(2.5, CEL * .17);
    for (let y = 0; y < R; y++) for (let x = 0; x < C; x++)
      if (puntos[ix(x, y)]) cx.fillRect((x + .5) * CEL - s / 2, (y + .5) * CEL - s / 2, s, s);
    /* destellos */
    const pulso = .78 + .22 * Math.sin(reloj * 5);
    for (let y = 0; y < R; y++) for (let x = 0; x < C; x++) {
      if (!destellos[ix(x, y)]) continue;
      const a = (x + .5) * CEL, b = (y + .5) * CEL, r = CEL * .36 * pulso;
      cx.strokeStyle = 'rgba(242,240,236,.9)'; cx.lineWidth = Math.max(1.4, CEL * .09);
      cx.beginPath();
      cx.moveTo(a - r, b); cx.lineTo(a + r, b); cx.moveTo(a, b - r); cx.lineTo(a, b + r);
      cx.moveTo(a - r * .6, b - r * .6); cx.lineTo(a + r * .6, b + r * .6);
      cx.moveTo(a + r * .6, b - r * .6); cx.lineTo(a - r * .6, b + r * .6);
      cx.stroke();
    }
    drones.forEach((d, k) => dron(px(d), k, asustados > 0));
    const abierto = Math.abs(Math.sin(reloj * 9)) * ((yo.dir[0] || yo.dir[1]) ? 1 : .25);
    const ang = Math.atan2(yo.dir[1], yo.dir[0]);
    diafragma(px(yo), abierto, (yo.dir[0] || yo.dir[1]) ? ang : 0);

    info.innerHTML = '<b>' + tanteo + '</b> &nbsp;·&nbsp; ' + Math.max(0, vidas) +
      (vidas === 1 ? ' vida' : ' vidas') + ' &nbsp;·&nbsp; nivel ' + nivel +
      (mejor ? ' &nbsp;·&nbsp; récord ' + mejor : '');
  }

  function perder() {
    vidas--;
    vibra([70, 60, 70]);
    if (vidas <= 0) { terminar(); return; }
    colocar(); asustados = 0; pausa = 1;
  }
  function terminar() {
    if (fin) return;
    fin = true; cancelAnimationFrame(raf);
    if (tanteo > mejor) { mejor = tanteo; mem.set('labMejor', mejor); }
    mostrarFin('Te alcanzaron', String(tanteo),
      'Llegaste al nivel ' + nivel + '. Récord: ' + mejor + '.', reiniciar);
  }
  function reiniciar() {
    tanteo = 0; vidas = 3; nivel = 1; fin = false;
    nivelNuevo(); ultimo = performance.now();
    raf = requestAnimationFrame(bucle);
  }

  function bucle(ahora) {
    const dt = Math.min(.05, (ahora - ultimo) / 1000); ultimo = ahora; reloj += dt;
    if (fin) return;
    if (enPausa) { pintar(); return; }
    if (pausa > 0) { pausa -= dt; pintar(); raf = requestAnimationFrame(bucle); return; }

    const vel = 5.1 + (nivel - 1) * .18;
    mover(yo, vel, dt, elegirYo);
    const velD = (asustados > 0 ? 2.9 : 4.25 + (nivel - 1) * .3);
    for (const d of drones) mover(d, velD, dt, elegirDron);

    /* levantar lo que haya en la casilla */
    const i = ix(yo.x, yo.y);
    if (puntos[i]) { puntos[i] = 0; quedan--; tanteo += 10; }
    if (destellos[i]) { destellos[i] = 0; asustados = 6; tanteo += 50; vibra(14); }
    if (asustados > 0) asustados = Math.max(0, asustados - dt);

    /* encuentros */
    const pa = px(yo);
    for (const d of drones) {
      const pb = px(d);
      if (Math.hypot(pa.x - pb.x, pa.y - pb.y) > CEL * .72) continue;
      if (asustados > 0) {
        tanteo += 200; vibra(20);
        d.x = d.nx = d.casa[0]; d.y = d.ny = d.casa[1]; d.t = 0; d.dir = [0, 0];
      } else { perder(); break; }
    }

    if (quedan === 0 && !fin) { nivel++; tanteo += 500; nivelNuevo(); }
    pintar();
    raf = requestAnimationFrame(bucle);
  }

  /* gestos y teclado */
  let t0 = null;
  cv.addEventListener('pointerdown', e => { t0 = { x: e.clientX, y: e.clientY }; }, { passive: true });
  cv.addEventListener('pointerup', e => {
    if (!t0 || fin) return;
    const dx = e.clientX - t0.x, dy = e.clientY - t0.y;
    if (Math.abs(dx) > 14 || Math.abs(dy) > 14)
      yo.pedida = Math.abs(dx) > Math.abs(dy) ? [Math.sign(dx), 0] : [0, Math.sign(dy)];
    t0 = null;
  }, { passive: true });
  const teclas = e => {
    const d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
    if (!d || fin) return;
    e.preventDefault(); yo.pedida = d;
  };
  addEventListener('keydown', teclas);
  const alRedimensionar = () => { medir(); pintar(); };
  addEventListener('resize', alRedimensionar);

  medir(); reiniciar();
  return {
    remedir() { medir(); pintar(); },
    salir() { fin = true; cancelAnimationFrame(raf); removeEventListener('keydown', teclas); removeEventListener('resize', alRedimensionar); }
  };
}

/* =========================================================================
   REACCIÓN DE LOS ACCESOS Y NAVEGACIÓN
   ========================================================================= */
function reactivo(el2) {
  const press = e => {
    el2.classList.add('press');
    const r = el2.getBoundingClientRect();
    const x = (e.clientX == null ? r.left + r.width / 2 : e.clientX) - r.left;
    const y = (e.clientY == null ? r.top + r.height / 2 : e.clientY) - r.top;
    const d = Math.max(r.width, r.height) * 2.2;
    const s = document.createElement('span');
    s.className = 'rip';
    s.style.width = s.style.height = d + 'px';
    s.style.left = x + 'px'; s.style.top = y + 'px';
    el2.appendChild(s);
    setTimeout(() => s.remove(), 640);
    vibra(9);
  };
  const rel = () => el2.classList.remove('press');
  el2.addEventListener('pointerdown', press, { passive: true });
  el2.addEventListener('pointerup', rel, { passive: true });
  el2.addEventListener('pointercancel', rel, { passive: true });
  el2.addEventListener('pointerleave', rel, { passive: true });
}
document.querySelectorAll('.lnk,.tile').forEach(reactivo);

/* el portfolio abre en la misma pestaña: esta página es un puente */
document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('a[data-same]');
  if (!a) return;
  if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  e.preventDefault();
  const url = a.href;
  document.body.classList.add('leaving');
  setTimeout(() => { location.href = url; }, 240);
  setTimeout(() => { if (!document.hidden) location.href = url; }, 1400);
});

/* =========================================================================
   FONDO — luz fuera de foco, a la deriva
   ========================================================================= */
const bg = document.getElementById('bg'), bx = bg.getContext('2d');
let W = 0, H = 0, DPR = 1;
function fit() {
  DPR = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  bg.width = W * DPR; bg.height = H * DPR;
  bx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', fit);
const ORBS = [
  { r: .62, x: .28, y: .30, sx: .021, sy: .014, c: '255,232,205', a: .085 },
  { r: .50, x: .74, y: .62, sx: -.017, sy: .019, c: '214,226,255', a: .062 },
  { r: .42, x: .52, y: .84, sx: .013, sy: -.011, c: '255,214,178', a: .055 },
  { r: .34, x: .16, y: .72, sx: .019, sy: -.016, c: '238,238,238', a: .040 }
];
function drawBG(t) {
  bx.fillStyle = '#0A0A0B'; bx.fillRect(0, 0, W, H);
  const S = Math.max(W, H);
  bx.globalCompositeOperation = 'lighter';
  for (const o of ORBS) {
    const cx2 = (o.x + Math.sin(t * o.sx * 6.2) * .13) * W;
    const cy2 = (o.y + Math.cos(t * o.sy * 6.2) * .11) * H;
    const rr = o.r * S * (.52 + .05 * Math.sin(t * .22 + o.x * 9));
    const g = bx.createRadialGradient(cx2, cy2, 0, cx2, cy2, rr);
    g.addColorStop(0, 'rgba(' + o.c + ',' + o.a + ')');
    g.addColorStop(.45, 'rgba(' + o.c + ',' + (o.a * .32).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(' + o.c + ',0)');
    bx.fillStyle = g; bx.fillRect(0, 0, W, H);
  }
  bx.globalCompositeOperation = 'source-over';
  const sweep = ((t * .045) % 1.5) - .25;
  const gx = bx.createLinearGradient(sweep * W - W * .3, 0, sweep * W + W * .3, H);
  gx.addColorStop(0, 'rgba(255,255,255,0)');
  gx.addColorStop(.5, 'rgba(255,246,232,.028)');
  gx.addColorStop(1, 'rgba(255,255,255,0)');
  bx.fillStyle = gx; bx.fillRect(0, 0, W, H);
  const bd = bx.createLinearGradient(0, H * .30, 0, H);
  bd.addColorStop(0, 'rgba(10,10,11,0)');
  bd.addColorStop(1, 'rgba(10,10,11,.52)');
  bx.fillStyle = bd; bx.fillRect(0, 0, W, H);
}
const gr = document.getElementById('grain'), gx2 = gr.getContext('2d');
function grainFit() { gr.width = Math.min(260, innerWidth); gr.height = Math.min(260, innerHeight); gr.style.width = '100vw'; gr.style.height = '100vh'; }
function drawGrain() {
  const im = gx2.createImageData(gr.width, gr.height);
  for (let i = 0; i < im.data.length; i += 4) { const v = (Math.random() * 255) | 0; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  gx2.putImageData(im, 0, 0);
}
addEventListener('resize', grainFit);
let t0 = performance.now(), gt = 0;
function loop(now) {
  drawBG((now - t0) / 1000);
  if (now - gt > 90) { drawGrain(); gt = now; }
  requestAnimationFrame(loop);
}
fit(); grainFit(); drawGrain(); textoReloj();
requestAnimationFrame(loop);
