<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0B">
<meta name="description" content="Leonardo Pisani — Photo & Video Maker">
<title>Leonardo Pisani</title>
<style>
  :root{
    --bg:#0A0A0B;
    --ink:#F2F0EC;
    --mut:#9A968E;
    --dim:#5A5750;
    --line:rgba(242,240,236,.14);
    --line2:rgba(242,240,236,.07);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    -webkit-user-select:none;user-select:none;overscroll-behavior:none;
    font-family:"Helvetica Neue",-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  #bg{position:fixed;inset:0;width:100%;height:100%;display:block}
  #grain{position:fixed;inset:0;pointer-events:none;opacity:.055;mix-blend-mode:overlay}
  #vig{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 44%,transparent 38%,rgba(0,0,0,.62) 100%)}

  main{position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:calc(34px + env(safe-area-inset-top)) 26px calc(28px + env(safe-area-inset-bottom));
    text-align:center}
  .stack{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center}

  .top{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%}

  h1{font-size:clamp(17px,6.1vw,33px);font-weight:200;letter-spacing:.24em;
    text-indent:.24em;line-height:1.16;white-space:nowrap}
  .role{margin-top:20px;font-size:clamp(9.5px,2.7vw,11.5px);font-weight:400;
    letter-spacing:.42em;text-indent:.42em;color:var(--mut);text-transform:uppercase}
  .hr{width:36px;height:1px;background:var(--line);margin:26px 0}

  /* marcas de oficio: línea fina, animadas */
  .marks{display:flex;align-items:flex-start;gap:30px;margin-top:2px}
  .mark{display:flex;flex-direction:column;align-items:center;gap:9px}
  .mark canvas{display:block}
  .mark span{font-size:7.5px;letter-spacing:.18em;text-indent:.18em;color:var(--dim);
    text-transform:uppercase;white-space:nowrap}

  /* accesos */
  .links{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
  .lnk{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;
    height:64px;text-decoration:none;letter-spacing:.30em;text-indent:.30em;
    font-size:12px;font-weight:500;text-transform:uppercase;
    color:var(--ink);background:transparent;
    border:1px solid rgba(242,240,236,.28);
    -webkit-user-select:none;user-select:none;will-change:transform;
    transition:transform .32s cubic-bezier(.2,.75,.3,1),
               color .30s ease, border-color .30s ease,
               letter-spacing .45s cubic-bezier(.2,.75,.3,1),
               box-shadow .32s ease}
  .lnk .label{position:relative;z-index:3}
  .arw{position:absolute;right:22px;z-index:3;font-size:14px;line-height:1;
    letter-spacing:0;text-indent:0;opacity:.55;
    transition:transform .38s cubic-bezier(.2,.75,.3,1),opacity .3s ease}

  /* relleno que sube desde abajo: el mismo para los dos */
  .lnk::after{content:'';position:absolute;inset:-1px;z-index:1;background:var(--ink);
    transform:scaleY(0);transform-origin:bottom;
    transition:transform .42s cubic-bezier(.2,.75,.3,1)}

  /* barrido de luz en reposo */
  .lnk::before{content:'';position:absolute;top:0;bottom:0;width:46%;z-index:2;
    left:-60%;pointer-events:none;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.13),transparent);
    animation:sheen 5.4s ease-in-out infinite}
  .lnk:nth-child(2)::before{animation-delay:2.2s}
  @keyframes sheen{0%{left:-60%}52%{left:120%}100%{left:120%}}

  /* --- puntero encima: se invierte por completo --- */
  @media (hover:hover) and (pointer:fine){
    .lnk:hover{color:#0A0A0B;border-color:var(--ink);
      letter-spacing:.38em;text-indent:.38em;transform:translateY(-3px);
      box-shadow:0 14px 38px rgba(0,0,0,.6)}
    .lnk:hover::after{transform:scaleY(1)}
    .lnk:hover .arw{transform:translateX(8px);opacity:1}
    .lnk:hover::before{animation-duration:1.5s;
      background:linear-gradient(100deg,transparent,rgba(10,10,11,.16),transparent)}
  }
  /* --- presionado: vale igual con dedo que con mouse --- */
  .lnk.press{color:#0A0A0B;border-color:var(--ink)}
  .lnk.press::after{transform:scaleY(1)}
  .lnk.press .arw{transform:translateX(8px);opacity:1}
  .lnk:active{transform:scale(.976);transition-duration:.09s}
  .lnk:focus-visible{outline:1px solid var(--ink);outline-offset:5px}

  /* onda desde el punto tocado */
  .rip{position:absolute;z-index:1;border-radius:50%;pointer-events:none;
    transform:translate(-50%,-50%) scale(0);animation:rip .62s cubic-bezier(.2,.7,.3,1) forwards}
  .rip{z-index:2}
  .lnk .rip{background:rgba(10,10,11,.18)}
  @keyframes rip{to{transform:translate(-50%,-50%) scale(1);opacity:0}}

  /* salida al navegar en la misma pestaña */
  body.leaving main{opacity:0;transform:translateY(-6px);
    transition:opacity .26s ease, transform .26s ease}
  body.leaving #bg,body.leaving #grain{opacity:.35;transition:opacity .26s ease}

  @media (prefers-reduced-motion:reduce){
    .lnk::before{animation:none;display:none}
    .lnk,.arw,.lnk::after{transition-duration:.01s}
  }
  .foot{margin-top:36px;display:flex;flex-direction:column;align-items:center;gap:13px}
  .social{display:flex;gap:22px}
  .social a{font-size:9px;letter-spacing:.28em;text-indent:.28em;color:var(--dim);
    text-decoration:none;text-transform:uppercase;transition:.25s}
  .social a:active{color:var(--mut)}
  .url{font-size:8.5px;letter-spacing:.22em;text-indent:.22em;color:rgba(90,87,80,.7);
    text-transform:uppercase}

  /* entrada suave, como fundido de video */
  .fade{opacity:0;transform:translateY(7px);animation:in 1.15s cubic-bezier(.2,.7,.3,1) forwards}
  .d1{animation-delay:.15s}.d2{animation-delay:.35s}.d3{animation-delay:.55s}
  .d4{animation-delay:.78s}.d5{animation-delay:.98s}.d6{animation-delay:1.15s}
  @keyframes in{to{opacity:1;transform:none}}
  /* salida al navegar en la misma pestaña */
  body.leaving main{opacity:0;transform:translateY(-6px);
    transition:opacity .26s ease, transform .26s ease}
  body.leaving #bg,body.leaving #grain{opacity:.35;transition:opacity .26s ease}

  @media (prefers-reduced-motion:reduce){.fade{animation:none;opacity:1;transform:none}}
  @media (max-height:640px){
    .hr{margin:18px 0}.marks{gap:22px}.foot{margin-top:18px}
    h1{font-size:clamp(24px,7vw,32px)}
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="grain"></canvas>
<div id="vig"></div>

<main>
  <div class="links fade d1">
    <a class="lnk" id="port" href="https://leopisani.myportfolio.com" data-same="1">
<span class="label">Portfolio</span><span class="arw">→</span></a>
    <a class="lnk" id="wa" target="_blank" rel="noopener">
<span class="label">WhatsApp</span><span class="arw">→</span></a>
  </div>

</main>

<script>
"use strict";
document.getElementById('wa').href='https://wa.me/5491151183272?text='+
  encodeURIComponent('Hola Leo! Vi tu portfolio y quiero consultarte por un proyecto.');

/* =========================================================================
   NAVEGACIÓN
   El portfolio abre en la misma pestaña: la portada es un puente, no un lugar
   al que volver, y así el botón "atrás" hace lo esperable.
   WhatsApp abre aparte, para que la portada siga viva cuando vuelvan del chat.
   ========================================================================= */
document.querySelectorAll('a[data-same]').forEach(a=>{
  a.addEventListener('click',e=>{
    /* respetar clic con modificadores, rueda del mouse y clic derecho */
    if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey) return;
    e.preventDefault();
    const url=a.href;
    document.body.classList.add('leaving');
    setTimeout(()=>{ location.href=url; },240);
    /* red aparte: si algo falla, igual navega */
    setTimeout(()=>{ if(!document.hidden) location.href=url; },1400);
  });
});

/* =========================================================================
   REACCIÓN DE LOS ACCESOS
   ========================================================================= */
document.querySelectorAll('.lnk').forEach(el=>{
  const press=e=>{
    el.classList.add('press');
    const r=el.getBoundingClientRect();
    const x=(e.clientX??(r.left+r.width/2))-r.left;
    const y=(e.clientY??(r.top+r.height/2))-r.top;
    const d=Math.max(r.width,r.height)*2.2;
    const s=document.createElement('span');
    s.className='rip';
    s.style.width=s.style.height=d+'px';
    s.style.left=x+'px'; s.style.top=y+'px';
    el.appendChild(s);
    setTimeout(()=>s.remove(),640);
    if(navigator.vibrate) navigator.vibrate(9);
  };
  const release=()=>el.classList.remove('press');
  el.addEventListener('pointerdown',press,{passive:true});
  el.addEventListener('pointerup',release,{passive:true});
  el.addEventListener('pointercancel',release,{passive:true});
  el.addEventListener('pointerleave',release,{passive:true});
});

/* =========================================================================
   FONDO — luz fuera de foco, a la deriva. Evoca video sin usar imágenes.
   ========================================================================= */
const bg=document.getElementById('bg'), bx=bg.getContext('2d');
let W=0,H=0,DPR=1;
function fit(){
  DPR=Math.min(2,devicePixelRatio||1);
  W=innerWidth; H=innerHeight;
  bg.width=W*DPR; bg.height=H*DPR;
  bx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',fit);

/* focos suaves, en gama cálida muy contenida */
const ORBS=[
  {r:.62,x:.28,y:.30,sx:.021,sy:.014,c:'255,232,205',a:.085},
  {r:.50,x:.74,y:.62,sx:-.017,sy:.019,c:'214,226,255',a:.062},
  {r:.42,x:.52,y:.84,sx:.013,sy:-.011,c:'255,214,178',a:.055},
  {r:.34,x:.16,y:.72,sx:.019,sy:-.016,c:'238,238,238',a:.040}
];
function drawBG(t){
  bx.fillStyle='#0A0A0B'; bx.fillRect(0,0,W,H);
  const S=Math.max(W,H);
  bx.globalCompositeOperation='lighter';
  for(const o of ORBS){
    const cx=(o.x+Math.sin(t*o.sx*6.2)*.13)*W;
    const cy=(o.y+Math.cos(t*o.sy*6.2)*.11)*H;
    const rr=o.r*S*(.52+.05*Math.sin(t*.22+o.x*9));
    const g=bx.createRadialGradient(cx,cy,0,cx,cy,rr);
    g.addColorStop(0,'rgba('+o.c+','+o.a+')');
    g.addColorStop(.45,'rgba('+o.c+','+(o.a*.32).toFixed(3)+')');
    g.addColorStop(1,'rgba('+o.c+',0)');
    bx.fillStyle=g; bx.fillRect(0,0,W,H);
  }
  bx.globalCompositeOperation='source-over';
  /* barrido lento, como una luz que cruza el encuadre */
  const sweep=((t*.045)%1.5)-.25;
  const gx=bx.createLinearGradient(sweep*W-W*.3,0,sweep*W+W*.3,H);
  gx.addColorStop(0,'rgba(255,255,255,0)');
  gx.addColorStop(.5,'rgba(255,246,232,.028)');
  gx.addColorStop(1,'rgba(255,255,255,0)');
  bx.fillStyle=gx; bx.fillRect(0,0,W,H);
  /* base oscura para que el texto siempre respire */
  const bd=bx.createLinearGradient(0,H*.30,0,H);
  bd.addColorStop(0,'rgba(10,10,11,0)');
  bd.addColorStop(1,'rgba(10,10,11,.52)');
  bx.fillStyle=bd; bx.fillRect(0,0,W,H);
}

/* ---------- grano de película ---------- */
const gr=document.getElementById('grain'), gx2=gr.getContext('2d');
function grainFit(){ gr.width=Math.min(260,innerWidth); gr.height=Math.min(260,innerHeight);
  gr.style.width='100vw'; gr.style.height='100vh'; }
function drawGrain(){
  const im=gx2.createImageData(gr.width,gr.height);
  for(let i=0;i<im.data.length;i+=4){
    const v=(Math.random()*255)|0;
    im.data[i]=im.data[i+1]=im.data[i+2]=v; im.data[i+3]=255;
  }
  gx2.putImageData(im,0,0);
}
addEventListener('resize',grainFit);

/* =========================================================================
   MARCAS DE OFICIO — trazo de 1px, monocromo
   ========================================================================= */
const STROKE='rgba(242,240,236,.55)', FAINT='rgba(242,240,236,.18)';
function setup(id){
  const c=document.getElementById(id), x=c.getContext('2d');
  const d=Math.min(2,devicePixelRatio||1);
  c.width=34*d; c.height=34*d; c.style.width='34px'; c.style.height='34px';
  x.setTransform(d,0,0,d,0,0);
  return x;
}
const xF=null, xV=null, xL=null;

/* FOTO: diafragma que respira */
function markFoto(t){
  const x=xF; x.clearRect(0,0,34,34);
  const cx=17, cy=17, R=12;
  x.strokeStyle=FAINT; x.lineWidth=1;
  x.beginPath(); x.arc(cx,cy,R,0,7); x.stroke();
  const k=.5+.5*Math.sin(t*.9);
  const r=R*(.26+.5*k);
  x.strokeStyle=STROKE;
  x.beginPath();
  for(let i=0;i<6;i++){
    const a=i*Math.PI/3+t*.10;
    const px=cx+Math.cos(a)*r, py=cy+Math.sin(a)*r;
    i?x.lineTo(px,py):x.moveTo(px,py);
  }
  x.closePath(); x.stroke();
  /* hojas hacia el aro */
  x.strokeStyle=FAINT;
  for(let i=0;i<6;i++){
    const a=i*Math.PI/3+t*.10;
    x.beginPath();
    x.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);
    x.lineTo(cx+Math.cos(a-0.5)*R,cy+Math.sin(a-0.5)*R);
    x.stroke();
  }
}
/* VIDEO: cuadros que avanzan */
function markVideo(t){
  const x=xV; x.clearRect(0,0,34,34);
  x.strokeStyle=FAINT; x.lineWidth=1;
  x.strokeRect(4.5,7.5,25,19);
  const off=(t*9)%7;
  x.strokeStyle=STROKE;
  for(let i=-1;i<5;i++){
    const px=6+i*7+off;
    if(px<6||px>27) continue;
    x.beginPath(); x.moveTo(px+.5,9.5); x.lineTo(px+.5,11.5); x.stroke();
    x.beginPath(); x.moveTo(px+.5,22.5); x.lineTo(px+.5,24.5); x.stroke();
  }
  x.strokeStyle=STROKE;
  x.beginPath(); x.moveTo(8.5,17.5); x.lineTo(8.5+16*(0.35+0.3*Math.sin(t*.8)),17.5); x.stroke();
}
/* STREAMING: la señal */
function markLive(t){
  const x=xL; x.clearRect(0,0,34,34);
  x.strokeStyle=FAINT; x.lineWidth=1;
  x.beginPath(); x.moveTo(3,17.5); x.lineTo(31,17.5); x.stroke();
  x.strokeStyle=STROKE;
  x.beginPath();
  const head=(t*13)%40-6;
  for(let i=0;i<=28;i++){
    const px=3+i;
    const k=px-head;
    const e=Math.exp(-(k*k)/26);
    const amp=e*8*(0.6+0.4*Math.sin(t*3+i*.5));
    if(i===0) x.moveTo(px,17.5-amp); else x.lineTo(px,17.5-amp);
  }
  x.stroke();
  /* punto de emisión */
  x.fillStyle=(Math.sin(t*2.2)>0)?'rgba(242,240,236,.85)':'rgba(242,240,236,.20)';
  x.beginPath(); x.arc(31,8,1.6,0,7); x.fill();
}

/* =========================================================================
   BUCLE
   ========================================================================= */
let t0=performance.now(), gt=0;
function loop(now){
  const t=(now-t0)/1000;
  drawBG(t);
  if(now-gt>90){ drawGrain(); gt=now; }
  requestAnimationFrame(loop);
}
fit(); grainFit(); drawGrain();
requestAnimationFrame(loop);
</script>
</body>
</html>
